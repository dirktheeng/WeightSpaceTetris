<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="440" rx="14" fill="#14161b"/>
  <text x="380" y="34" fill="#e7e9ee" font-size="18" text-anchor="middle" font-weight="bold">One screen = 12 binary channels on a 21 x 16 grid</text>
  <g font-size="15" fill="#e7e9ee">
    <g transform="translate(40,62)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#3a3f4b" stroke="#8b90a0"/><text x="30" y="14"><tspan font-weight="bold">W</tspan>  walls and floor</text>
      <rect x="0" y="28" width="18" height="18" rx="3" fill="#5b8def"/><text x="30" y="42"><tspan font-weight="bold">L</tspan>  locked cells (the stack)</text>
      <rect x="0" y="56" width="18" height="18" rx="3" fill="#f2a541"/><text x="30" y="70"><tspan font-weight="bold">A</tspan>  active (falling) piece</text>
      <rect x="0" y="84" width="18" height="18" rx="3" fill="#c47f1f"/><text x="30" y="98"><tspan font-weight="bold">P</tspan>  pivot of active piece</text>
      <rect x="0" y="112" width="18" height="18" rx="3" fill="#7fd18b"/><text x="30" y="126"><tspan font-weight="bold">Q</tspan>  preview piece</text>
      <rect x="0" y="140" width="18" height="18" rx="3" fill="#4fa860"/><text x="30" y="154"><tspan font-weight="bold">R</tspan>  preview pivot</text>
      <rect x="0" y="168" width="18" height="18" rx="3" fill="#7fd18b"/><text x="30" y="182"><tspan font-weight="bold">S</tspan>  score bits (16-bit binary)</text>
      <rect x="0" y="196" width="18" height="18" rx="3" fill="#7fd18b"/><text x="30" y="210"><tspan font-weight="bold">T</tspan>  gravity timer token</text>
      <rect x="0" y="224" width="18" height="18" rx="3" fill="#e5484d"/><text x="30" y="238"><tspan font-weight="bold">G</tspan>  game over flag</text>
      <rect x="0" y="252" width="18" height="18" rx="3" fill="none" stroke="#8b90a0"/><text x="30" y="266"><tspan font-weight="bold">MQ</tspan>  preview anchor (static)</text>
      <rect x="0" y="280" width="18" height="18" rx="3" fill="none" stroke="#8b90a0"/><text x="30" y="294"><tspan font-weight="bold">MS</tspan>  score field (static)</text>
      <rect x="0" y="308" width="18" height="18" rx="3" fill="none" stroke="#8b90a0"/><text x="30" y="322"><tspan font-weight="bold">MT</tspan>  timer field (static)</text>
      <text x="0" y="360" fill="#8b90a0" font-size="13">Every cell of every channel is exactly 0 or 1.</text>
    </g>
  </g>
  <!-- grid: 16 cols x 21 rows, cell 16px -->
  <g transform="translate(330,62)">
    <rect x="0" y="0" width="256" height="336" fill="#0e1014"/>
    <rect x="0" y="0" width="16" height="336" fill="#3a3f4b"/>
    <rect x="176" y="0" width="16" height="336" fill="#3a3f4b"/>
    <rect x="0" y="320" width="192" height="16" fill="#3a3f4b"/>
    <!-- active T, pivot at col 5 row 1 -->
    <rect x="81" y="1" width="14" height="14" fill="#f2a541"/>
    <rect x="65" y="17" width="14" height="14" fill="#f2a541"/>
    <rect x="81" y="17" width="14" height="14" fill="#c47f1f"/>
    <rect x="97" y="17" width="14" height="14" fill="#f2a541"/>
    <!-- stack -->
    <g fill="#5b8def">
      <rect x="17" y="305" width="14" height="14"/><rect x="33" y="305" width="14" height="14"/><rect x="49" y="305" width="14" height="14"/><rect x="65" y="305" width="14" height="14"/><rect x="81" y="305" width="14" height="14"/><rect x="113" y="305" width="14" height="14"/><rect x="129" y="305" width="14" height="14"/><rect x="145" y="305" width="14" height="14"/><rect x="161" y="305" width="14" height="14"/>
      <rect x="17" y="289" width="14" height="14"/><rect x="33" y="289" width="14" height="14"/><rect x="129" y="289" width="14" height="14"/><rect x="145" y="289" width="14" height="14"/><rect x="161" y="289" width="14" height="14"/>
      <rect x="17" y="273" width="14" height="14"/><rect x="161" y="273" width="14" height="14"/>
    </g>
    <!-- preview: L piece, pivot at col 13 row 1 -->
    <rect x="225" y="1" width="14" height="14" fill="#7fd18b"/>
    <rect x="193" y="17" width="14" height="14" fill="#7fd18b"/>
    <rect x="209" y="17" width="14" height="14" fill="#4fa860"/>
    <rect x="225" y="17" width="14" height="14" fill="#7fd18b"/>
    <!-- score field col 13 rows 4-19 -->
    <rect x="211" y="66" width="12" height="252" fill="none" stroke="#3a3f4b"/>
    <rect x="212" y="306" width="10" height="10" fill="#7fd18b"/><rect x="212" y="274" width="10" height="10" fill="#7fd18b"/>
    <!-- timer field col 15 rows 4-10 -->
    <rect x="243" y="66" width="12" height="108" fill="none" stroke="#3a3f4b"/>
    <rect x="245" y="100" width="8" height="8" fill="#7fd18b"/>
    <text x="96" y="356" fill="#8b90a0" font-size="13" text-anchor="middle">10 x 20 playfield</text>
  </g>
  <g fill="#e7e9ee" font-size="13">
    <path d="M600,78 H644" stroke="#8b90a0"/><text x="650" y="82">preview (Q, R)</text>
    <path d="M590,150 H644" stroke="#8b90a0"/><text x="650" y="154">timer (T)</text>
    <path d="M560,300 H644" stroke="#8b90a0"/><text x="650" y="296">score (S)</text>
    <text x="650" y="312" fill="#8b90a0">binary, MSB top</text>
  </g>
</svg>
