<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="420" rx="14" fill="#14161b"/>
  <text x="380" y="34" fill="#e7e9ee" font-size="17" text-anchor="middle" font-weight="bold">One screen = 12 transparent sheets stacked like a layer cake</text>
  <g font-size="13">
    <!-- stacked sheets, each offset -->
    <g transform="translate(60,60)">
      <g opacity="0.95">
        <rect x="0" y="0" width="190" height="26" rx="4" fill="#3a3f4b"/><text x="10" y="18" fill="#e7e9ee">W  walls and floor</text>
        <rect x="0" y="28" width="190" height="26" rx="4" fill="#5b8def"/><text x="10" y="46" fill="#0e1014">L  locked cells (the stack)</text>
        <rect x="0" y="56" width="190" height="26" rx="4" fill="#f2a541"/><text x="10" y="74" fill="#0e1014">A  falling piece</text>
        <rect x="0" y="84" width="190" height="26" rx="4" fill="#c47f1f"/><text x="10" y="102" fill="#0e1014">P  pivot (rotation center)</text>
        <rect x="0" y="112" width="190" height="26" rx="4" fill="#7fd18b"/><text x="10" y="130" fill="#0e1014">Q  preview piece</text>
        <rect x="0" y="140" width="190" height="26" rx="4" fill="#4fa860"/><text x="10" y="158" fill="#0e1014">R  preview pivot</text>
        <rect x="0" y="168" width="190" height="26" rx="4" fill="#7fd18b"/><text x="10" y="186" fill="#0e1014">S  score bits</text>
        <rect x="0" y="196" width="190" height="26" rx="4" fill="#7fd18b"/><text x="10" y="214" fill="#0e1014">T  timer token</text>
        <rect x="0" y="224" width="190" height="26" rx="4" fill="#e5484d"/><text x="10" y="242" fill="#0e1014">G  game over</text>
        <rect x="0" y="252" width="190" height="26" rx="4" fill="#2a2e38"/><text x="10" y="270" fill="#e7e9ee">MQ  preview anchor (fixed)</text>
        <rect x="0" y="280" width="190" height="26" rx="4" fill="#2a2e38"/><text x="10" y="298" fill="#e7e9ee">MS  score field (fixed)</text>
        <rect x="0" y="308" width="190" height="26" rx="4" fill="#2a2e38"/><text x="10" y="326" fill="#e7e9ee">MT  timer field (fixed)</text>
      </g>
    </g>
    <!-- board sketch -->
    <g transform="translate(330,60)">
      <rect x="0" y="0" width="16" height="336" fill="#3a3f4b"/>
      <rect x="176" y="0" width="16" height="336" fill="#3a3f4b"/>
      <rect x="0" y="320" width="192" height="16" fill="#3a3f4b"/>
      <rect x="64" y="0" width="32" height="16" fill="#f2a541"/><rect x="80" y="16" width="16" height="16" fill="#f2a541"/>
      <rect x="64" y="16" width="16" height="16" fill="#c47f1f"/><rect x="48" y="16" width="16" height="16" fill="#f2a541"/>
      <rect x="16" y="288" width="128" height="32" fill="#5b8def"/><rect x="144" y="304" width="16" height="16" fill="#5b8def"/>
      <rect x="208" y="0" width="16" height="16" fill="#7fd18b"/><rect x="192" y="16" width="48" height="16" fill="#7fd18b"/>
      <rect x="208" y="16" width="16" height="16" fill="#4fa860"/>
      <g fill="none" stroke="#2a2e38"><rect x="210" y="66" width="12" height="252"/><rect x="242" y="66" width="12" height="108"/></g>
      <rect x="211" y="306" width="10" height="10" fill="#7fd18b"/><rect x="243" y="100" width="10" height="10" fill="#7fd18b"/>
      <text x="96" y="356" fill="#8b90a0" text-anchor="middle">10 x 20 board</text>
    </g>
    <g fill="#8b90a0">
      <text x="600" y="78">preview box</text>
      <text x="600" y="96">(next piece)</text>
      <text x="600" y="210">score column:</text>
      <text x="600" y="228">16 binary digits</text>
      <text x="600" y="150">timer column:</text>
      <text x="600" y="168">7 cells</text>
    </g>
  </g>
</svg>
