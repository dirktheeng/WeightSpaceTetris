<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="330" rx="14" fill="#14161b"/>
  <text x="380" y="32" fill="#e7e9ee" font-size="17" text-anchor="middle" font-weight="bold">Every neuron: add up (inputs x weights) + bias, then clamp between 0 and 1</text>
  <!-- curve -->
  <g transform="translate(40,60)">
    <line x1="0" y1="200" x2="260" y2="200" stroke="#3a3f4b"/>
    <line x1="130" y1="0" x2="130" y2="220" stroke="#3a3f4b"/>
    <polyline points="0,200 130,200 180,120 260,120" fill="none" stroke="#f2a541" stroke-width="4"/>
    <text x="250" y="218" fill="#8b90a0" font-size="12" text-anchor="end">sum</text>
    <text x="138" y="125" fill="#8b90a0" font-size="12">1</text>
    <text x="138" y="196" fill="#8b90a0" font-size="12">0</text>
    <text x="130" y="245" fill="#e7e9ee" font-size="14" text-anchor="middle">clamp01: below 0 becomes 0,</text>
    <text x="130" y="263" fill="#e7e9ee" font-size="14" text-anchor="middle">above 1 becomes 1</text>
  </g>
  <!-- AND example, animated -->
  <g transform="translate(340,70)" font-size="15">
    <text x="0" y="0" fill="#f2a541" font-weight="bold">AND of two cells: weights 1 and 1, bias -1</text>
    <g>
      <text x="0" y="34" fill="#e7e9ee">inputs</text>
      <text x="0" y="64" fill="#e7e9ee">sum</text>
      <text x="0" y="94" fill="#e7e9ee">output</text>
      <g text-anchor="middle">
        <text x="120" y="34" fill="#8b90a0">0, 0</text><text x="120" y="64" fill="#8b90a0">-1</text><text x="120" y="94" fill="#5b8def" font-weight="bold">0</text>
        <text x="200" y="34" fill="#8b90a0">1, 0</text><text x="200" y="64" fill="#8b90a0">0</text><text x="200" y="94" fill="#5b8def" font-weight="bold">0</text>
        <text x="280" y="34" fill="#8b90a0">0, 1</text><text x="280" y="64" fill="#8b90a0">0</text><text x="280" y="94" fill="#5b8def" font-weight="bold">0</text>
        <text x="360" y="34" fill="#8b90a0">1, 1</text><text x="360" y="64" fill="#8b90a0">1</text><text x="360" y="94" fill="#7fd18b" font-weight="bold">1</text>
      </g>
      <rect x="85" y="14" width="70" height="92" rx="6" fill="none" stroke="#f2a541" stroke-width="2">
        <animate attributeName="x" values="85;165;245;325;85" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="0" y="150" fill="#f2a541" font-weight="bold">The same trick gives every logic gate:</text>
    <text x="0" y="176" fill="#e7e9ee">OR: weights 1, bias 0 (the clamp stops at 1)</text>
    <text x="0" y="200" fill="#e7e9ee">NOT: weight -1, bias 1</text>
    <text x="0" y="224" fill="#e7e9ee">"at least k": weights 1, bias -(k-1)</text>
  </g>
</svg>
