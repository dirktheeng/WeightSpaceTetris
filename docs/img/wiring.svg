<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="510" rx="14" fill="#14161b"/>
  <text x="380" y="28" fill="#e7e9ee" font-size="17" text-anchor="middle" font-weight="bold">How the nine parts connect (node counts in brackets)</text>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8b90a0"/></marker></defs>

  <!-- boxes -->
  <g font-size="13" text-anchor="middle">
    <rect x="200" y="44" width="360" height="34" rx="8" fill="#1d2027" stroke="#e7e9ee"/>
    <text x="380" y="66" fill="#e7e9ee">input: screen (12 channels), key, random number</text>

    <rect x="20" y="100" width="710" height="40" rx="8" fill="#1d2027" stroke="#8b90a0"/>
    <text x="375" y="118" fill="#e7e9ee" font-weight="bold">Global facts (5)</text>
    <text x="375" y="133" fill="#8b90a0" font-size="11">g0 game over · aE no falling piece · F, fF full rows · gt gravity tick</text>

    <rect x="20" y="190" width="140" height="60" rx="8" fill="#1d2027" stroke="#f2a541"/>
    <text x="90" y="216" fill="#f2a541" font-weight="bold">Move, rotate (32)</text>
    <text x="90" y="234" fill="#8b90a0" font-size="11">stage 1</text>

    <rect x="210" y="190" width="140" height="60" rx="8" fill="#1d2027" stroke="#e0884a"/>
    <text x="280" y="216" fill="#e0884a" font-weight="bold">Gravity, lock (10)</text>
    <text x="280" y="234" fill="#8b90a0" font-size="11">stage 2</text>

    <rect x="400" y="190" width="140" height="60" rx="8" fill="#1d2027" stroke="#e5484d"/>
    <text x="470" y="216" fill="#e5484d" font-weight="bold">Spawn, game over (8)</text>
    <text x="470" y="234" fill="#8b90a0" font-size="11">stage 3</text>

    <rect x="590" y="190" width="140" height="60" rx="8" fill="#1d2027" stroke="#7fd18b"/>
    <text x="660" y="216" fill="#7fd18b" font-weight="bold">Preview, random (17)</text>
    <text x="660" y="234" fill="#8b90a0" font-size="11">also reads rng</text>

    <rect x="60" y="310" width="240" height="50" rx="8" fill="#1d2027" stroke="#5b8def"/>
    <text x="180" y="332" fill="#5b8def" font-weight="bold">Stack, line clear (5)</text>
    <text x="180" y="349" fill="#8b90a0" font-size="11">also reads F from Global facts</text>

    <rect x="320" y="310" width="120" height="50" rx="8" fill="#1d2027" stroke="#b48ead"/>
    <text x="380" y="332" fill="#b48ead" font-weight="bold">Timer (3)</text>
    <text x="380" y="349" fill="#8b90a0" font-size="11">reads gt</text>

    <rect x="500" y="310" width="120" height="50" rx="8" fill="#1d2027" stroke="#ebcb8b"/>
    <text x="560" y="332" fill="#ebcb8b" font-weight="bold">Score (3)</text>
    <text x="560" y="349" fill="#8b90a0" font-size="11">reads fF</text>

    <rect x="20" y="420" width="150" height="44" rx="8" fill="#1d2027" stroke="#4c566a"/>
    <text x="95" y="438" fill="#8b90a0" font-weight="bold">Fixtures (4)</text>
    <text x="95" y="455" fill="#8b90a0" font-size="11">W, MQ, MS, MT copied</text>

    <rect x="220" y="420" width="400" height="44" rx="8" fill="#1d2027" stroke="#e7e9ee"/>
    <text x="420" y="447" fill="#e7e9ee" font-weight="bold">next screen</text>
  </g>

  <!-- arrows -->
  <g stroke="#8b90a0" stroke-width="1.6" fill="none" marker-end="url(#m)">
    <path d="M380,78 V98"/>
    <path d="M90,140 V188"/>
    <path d="M280,140 V188"/>
    <path d="M470,140 V188"/>
    <path d="M160,220 H208"/>
    <path d="M350,220 H398"/>
    <path d="M540,220 H588"/>
    <path d="M90,250 V308"/>
    <path d="M280,250 V308"/>
    <path d="M470,250 V418"/>
    <path d="M660,250 V441 H622"/>
    <path d="M180,360 V418"/>
    <path d="M380,360 V418"/>
    <path d="M560,360 V418"/>
    <path d="M170,442 H218"/>
  </g>

  <!-- labels: what crosses each arrow -->
  <g font-size="11" fill="#e7e9ee">
    <text x="96" y="168">g0</text>
    <text x="286" y="168">gt, g0</text>
    <text x="476" y="168">aE, fF, g0</text>
    <text x="166" y="212">A1, P1</text>
    <text x="356" y="212">A2, P2</text>
    <text x="560" y="212">e</text>
    <text x="96" y="284">A1</text>
    <text x="286" y="284">lock</text>
    <text x="476" y="290">A, P, G</text>
    <text x="666" y="290">Q, R</text>
    <text x="186" y="394">L</text>
    <text x="386" y="394">T</text>
    <text x="566" y="394">S</text>
  </g>

  <text x="380" y="494" fill="#8b90a0" font-size="12" text-anchor="middle">Every part also reads the input screen directly. No other links exist.</text>
</svg>
