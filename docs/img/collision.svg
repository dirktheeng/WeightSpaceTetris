<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="290" rx="14" fill="#14161b"/>
  <text x="380" y="32" fill="#e7e9ee" font-size="17" text-anchor="middle" font-weight="bold">Collision test: "try" the move, look for any overlap, then decide</text>
  <g font-size="13" fill="#8b90a0" text-anchor="middle">
    <!-- panel 1 -->
    <g transform="translate(40,60)">
      <rect x="0" y="0" width="20" height="160" fill="#3a3f4b"/>
      <rect x="40" y="40" width="20" height="20" fill="#f2a541"/><rect x="40" y="60" width="20" height="20" fill="#f2a541"/>
      <rect x="20" y="120" width="40" height="40" fill="#5b8def"/>
      <text x="70" y="190">1. piece next to a wall</text>
    </g>
    <!-- panel 2 -->
    <g transform="translate(220,60)">
      <rect x="0" y="0" width="20" height="160" fill="#3a3f4b"/>
      <rect x="20" y="40" width="20" height="20" fill="#f2a541" opacity=".6"/><rect x="20" y="60" width="20" height="20" fill="#f2a541" opacity=".6"/>
      <rect x="20" y="120" width="40" height="40" fill="#5b8def"/>
      <text x="70" y="190">2. shifted copy (ovL)</text>
      <text x="70" y="208">try LEFT once more...</text>
    </g>
    <!-- panel 3 -->
    <g transform="translate(400,60)">
      <rect x="0" y="0" width="20" height="160" fill="#3a3f4b"/>
      <rect x="0" y="40" width="20" height="20" fill="#e5484d"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="0" y="60" width="20" height="20" fill="#e5484d"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="20" y="120" width="40" height="40" fill="#5b8def"/>
      <text x="70" y="190">3. copy AND (wall OR stack)</text>
      <text x="70" y="208">= red cells: overlap!</text>
    </g>
    <!-- panel 4 -->
    <g transform="translate(555,70)" text-anchor="start" font-size="14">
      <text x="0" y="20" fill="#e7e9ee">4. one scalar neuron adds up</text>
      <text x="0" y="40" fill="#e7e9ee">all red cells over the board:</text>
      <text x="0" y="74" fill="#f2a541" font-size="15">okL = NOT (any overlap)</text>
      <text x="0" y="108" fill="#e7e9ee">5. moveLeft = key AND okL</text>
      <text x="0" y="128" fill="#e7e9ee">AND not game over</text>
      <text x="0" y="162" fill="#7fd18b">blocked, so the piece stays</text>
    </g>
  </g>
</svg>
