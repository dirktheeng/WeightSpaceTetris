<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="300" rx="14" fill="#14161b"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b90a0"/>
    </marker>
  </defs>
  <!-- screen -->
  <rect x="40" y="70" width="150" height="150" rx="10" fill="#1d2027" stroke="#5b8def" stroke-width="2"/>
  <text x="115" y="60" fill="#e7e9ee" font-size="16" text-anchor="middle" font-weight="bold">Screen</text>
  <text x="115" y="140" fill="#8b90a0" font-size="13" text-anchor="middle">board, falling piece,</text>
  <text x="115" y="158" fill="#8b90a0" font-size="13" text-anchor="middle">preview, score, timer</text>
  <text x="115" y="176" fill="#8b90a0" font-size="13" text-anchor="middle">(the ONLY memory)</text>
  <!-- inputs -->
  <rect x="270" y="20" width="130" height="44" rx="8" fill="#1d2027" stroke="#f2a541"/>
  <text x="335" y="47" fill="#e7e9ee" font-size="14" text-anchor="middle">Key pressed</text>
  <rect x="270" y="236" width="130" height="44" rx="8" fill="#1d2027" stroke="#7fd18b"/>
  <text x="335" y="263" fill="#e7e9ee" font-size="14" text-anchor="middle">Random number</text>
  <!-- network -->
  <rect x="300" y="95" width="190" height="100" rx="12" fill="#2a2214" stroke="#f2a541" stroke-width="2"/>
  <text x="395" y="135" fill="#f2a541" font-size="18" text-anchor="middle" font-weight="bold">The network</text>
  <text x="395" y="158" fill="#e7e9ee" font-size="13" text-anchor="middle">87 nodes, 1,035 numbers</text>
  <text x="395" y="176" fill="#8b90a0" font-size="12" text-anchor="middle">all hand-written</text>
  <!-- next screen -->
  <rect x="570" y="70" width="150" height="150" rx="10" fill="#1d2027" stroke="#5b8def" stroke-width="2"/>
  <text x="645" y="60" fill="#e7e9ee" font-size="16" text-anchor="middle" font-weight="bold">Next screen</text>
  <text x="645" y="150" fill="#8b90a0" font-size="13" text-anchor="middle">drawn for the player,</text>
  <text x="645" y="168" fill="#8b90a0" font-size="13" text-anchor="middle">then fed back in</text>
  <!-- arrows -->
  <path d="M190,145 L298,145" stroke="#8b90a0" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M335,64 L370,93" stroke="#8b90a0" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M335,236 L370,197" stroke="#8b90a0" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M490,145 L568,145" stroke="#8b90a0" stroke-width="2" marker-end="url(#ar)"/>
  <path id="back" d="M645,220 C645,300 115,300 115,222" fill="none" stroke="#8b90a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="560" y="292" fill="#8b90a0" font-size="12" text-anchor="middle">repeats 10 times per second</text>
  <!-- travelling pulse -->
  <circle r="7" fill="#f2a541">
    <animateMotion dur="3s" repeatCount="indefinite" path="M115,145 L395,145 L645,145 L645,220 C645,300 115,300 115,222 L115,145"/>
  </circle>
</svg>
